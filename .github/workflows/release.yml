name: Release (Melos)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BatTrack
        uses: actions/checkout@v4
        with:
          path: bat_track_v1

      - name: Checkout SharedModels
        uses: actions/checkout@v4
        with:
          repository: godzyken/shared_models
          token: ${{ secrets.GH_PAT }}
          path: shared_models

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Create dummy firebase_options.dart
        run: |
          mkdir -p bat_track_v1/lib
          echo "import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;" > bat_track_v1/lib/firebase_options.dart
          echo "import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;" >> bat_track_v1/lib/firebase_options.dart
          echo "class DefaultFirebaseOptions { static FirebaseOptions get currentPlatform => const FirebaseOptions(apiKey: 'dummy', appId: 'dummy', messagingSenderId: 'dummy', projectId: 'dummy'); }" >> bat_track_v1/lib/firebase_options.dart

      - name: Melos Bootstrap
        run: melos bootstrap
        working-directory: bat_track_v1

      - name: Build runner
        run: melos run build_runner
        working-directory: bat_track_v1

      - name: Analyze
        run: melos run analyze
        working-directory: bat_track_v1

      - name: Test
        run: melos run test
        working-directory: bat_track_v1

      - name: Build APK (release)
        run: flutter build apk --release
        working-directory: bat_track_v1

      - name: Build Web (release)
        run: flutter build web --release
        working-directory: bat_track_v1

      - name: Zip web build
        run: |
          cd bat_track_v1/build/web
          zip -r ../../../web-release.zip .
          cd -

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bat_track_v1/build/app/outputs/flutter-apk/app-release.apk
            web-release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
