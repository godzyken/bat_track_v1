name: Flutter CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shared_models
        env:
          KEY: ${{ secrets.SHARED_MODELS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${KEY:-}" ]; then
            echo "Missing SHARED_MODELS_DEPLOY_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh packages
          KEY_FILE="$HOME/.ssh/shared_models_ci"

          if [[ "$KEY" != *"BEGIN"* ]] &&
             echo "$KEY" | grep -qE '^[A-Za-z0-9+/=]+$'; then
            echo "$KEY" | base64 -d | tr -d '\r' > "$KEY_FILE"
          elif [[ "$KEY" == *'\n'* ]] &&
               [[ "$KEY" != *$'\n'* ]]; then
            printf '%s' "$KEY" | sed 's/\\n/\n/g' > "$KEY_FILE"
          else
            printf '%s\n' "$KEY" | tr -d '\r' > "$KEY_FILE"
          fi

          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT

          ssh-keyscan -t ed25519,rsa github.com \
            >> ~/.ssh/known_hosts 2>/dev/null

          rm -rf packages/shared_models
          GIT_SSH_COMMAND="ssh -i $KEY_FILE \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes" \
            git clone --depth 1 --branch master \
            git@github.com:godzyken/shared_models.git \
            packages/shared_models

          for file in pubspec.yaml pubspec_overrides.yaml; do
            if [ -f "$file" ]; then
              tr -d '\r' < "$file" > "$file.tmp" && mv "$file.tmp" "$file"
              sed -i 's|path:.*shared_models|path: packages/shared_models|g' "$file"
              echo "Updated $file:"
              cat "$file"
            fi
          done

          echo "shared_models installed successfully"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Verify SDK
        run: |
          flutter --version
          dart --version

      - name: Format shared_models
        run: dart format packages/shared_models

      - name: Install shared_models dependencies
        run: |
          cd packages/shared_models
          flutter pub get
          cd ../..

      - name: Install dependencies
        run: flutter pub get -v

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze
        run: |
          output=$(flutter analyze --no-pub || true)
          echo "$output"
          if echo "$output" | grep -q "error •"; then
            echo "Analysis failed with errors."
            exit 1
          elif echo "$output" | grep -q "warning •"; then
            echo "Analysis failed with warnings."
            exit 1
          else
            echo "Analysis passed (no errors or warnings)."
          fi

      - name: Run tests
        run: flutter test --no-pub
