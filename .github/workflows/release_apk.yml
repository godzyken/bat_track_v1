name: Release APK & GitHub Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Decode Keystore from Base64
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ runner.temp }}/upload-keystore.jks

      - name: Extract Version and Tag Name
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            BUILD_NAME="${TAG_NAME#v}"
          else
            TAG_NAME="dev-${{ github.run_number }}"
            BUILD_NAME=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1 | tr -d '[:space:]')
            if [ -z "$BUILD_NAME" ]; then
              BUILD_NAME="0.0.1"
            fi
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "BUILD_NAME=$BUILD_NAME" >> $GITHUB_ENV
          echo "Extracted TAG_NAME: $TAG_NAME, BUILD_NAME: $BUILD_NAME"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-name=${{ env.BUILD_NAME }} --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/bat_track_v1-${{ env.TAG_NAME }}.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bat_track_v1-${{ env.TAG_NAME }}-apk
          path: build/app/outputs/flutter-apk/bat_track_v1-${{ env.TAG_NAME }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/bat_track_v1-${{ env.TAG_NAME }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
